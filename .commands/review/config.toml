[pack]
name      = "review"
when      = "收口评审：评审包生成 / 发现引文校验（code-review skill 的机械面）"
confirmed = true

[tasks."review.pack"]
run     = ["python .commands/review/scripts/review_pack.py pack <args>"]
timeout = 120
when    = "code-review skill 第 3 步 评审包：每批收尾、派遣评审子代理之前"
note    = "--base <rev> 必填(评审起点 rev 显式指定)。输出基线与 HEAD hash、diff 统计与 400 行分档提示、改动文件清单、红线/安全敏感面预警 —— 红线清单来自 .commands/my-commit-flow/.my-commit-flow.toml 的 red_lines(本项目 = resources-do-not-track/ + config.yml) 与 warn_lines, 缺文件给可见警告不静默降级。分档与预警是提示不是闸门, 拦截仍归提交闸门。用裸 python 运行"

[tasks."review.check"]
run     = ["python .commands/review/scripts/review_pack.py check <args>"]
timeout = 120
when    = "code-review skill 第 5 步 产出裁决：reviewer 交回 findings JSON 后、采信任何一条之前"
note    = "--findings <json文件|-> 必填(- 指 stdin)。逐条校验: 字段齐全(file/line/quote/severity/claim/relevance/fix 七字段)、severity/relevance 枚举合法、quote 与源码逐字比对(单行内连续片段 ≥4 字符, 行号允许 ±3 邻近, --window 可调)。REFUTE 的发现直接弃、不复核; rc=0 全部通过 / rc=1 存在被弃条目 / rc=2 用法或环境错误。用裸 python 运行"

[tasks."review.trace"]
run     = ["python .commands/review/scripts/check_review_trace.py <args>"]
timeout = 60
when    = "提交闸门(每次提交跑): 批内累计改动是否需要评审、`Review:` trailer 声明与实算是否一致"
note    = "批次 = 最近一条带 Review:/Review-Skip: 的提交 → 当前工作树(锚点现算, 不用填 hash; 历史 Skip 照旧识别, 不追溯)。判据顺序: 实算恒 0(纯记账类/生成物, 及 0 行二进制改动)且无 Review: trailer 才静默; 带 trailer 的 0 行批不短路照走全链校验(二进制改动实算恒 0, 基比对是它唯一的机检面) → Review 行校验(声明行数 == 实算 ±0; blocker/修/入池 数字齐, 修/入池/检 P/T 为全轮累计且 P ≥ 修+入池; `· 基 <12hex>` 必填且与闸门重算的整批过滤 diff 哈希一致 —— 不一致=评审后有新改动, 重跑 review.pack 取新基补一轮复评; `· 轮 R` 缺省 1, 写了须整数 ≥1; >400 行须 `· 派发 ≥2`) → Review-Skip 判红(豁免已退役, 理由长短不再看) → 其余拦下(可评行数 >0 即需 Review: trailer)。安全敏感面 = red_lines ∪ 路径标记词(与 review_pack 同源), 命中不论行数都要评。stdout 静默即通过; 红给一行原因 + 下一步。用裸 python 不用 uv run: 脚本纯 stdlib, 提交闸门不押在 console-script trampoline 上"
